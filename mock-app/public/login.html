<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Electro Pi POS</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="auth-wrap">
    <form class="auth-card" data-testid="login-form" novalidate>
      <div class="brand"><span class="dot"></span> Electro Pi POS</div>
      <p class="sub">Sign in to your store workspace</p>

      <div class="alert error" data-testid="login-error" role="alert" hidden></div>

      <div class="field">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="username" data-testid="login-email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" data-testid="login-password" />
      </div>

      <button class="primary" type="submit" data-testid="login-submit" style="width:100%">Sign in</button>
    </form>
  </div>

  <div class="toasts" data-testid="toast-container"></div>

  <script type="module">
    import { Session, api, showToast } from '/app.js';

    Session.clear();
    const form = document.querySelector('[data-testid="login-form"]');
    const errorBox = document.querySelector('[data-testid="login-error"]');
    const submit = document.querySelector('[data-testid="login-submit"]');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.hidden = true;
      submit.disabled = true;
      submit.textContent = 'Signing in…';
      try {
        const payload = await api('/auth/login', {
          method: 'POST',
          auth: false,
          body: {
            email: form.elements.email.value.trim(),
            password: form.elements.password.value,
          },
        });
        Session.save(payload);
        location.assign('/dashboard.html');
      } catch (err) {
        errorBox.textContent = err.status === 401 ? 'Email or password is incorrect.' : 'Sign in failed. Please try again.';
        errorBox.hidden = false;
        showToast('Sign in failed', 'error');
        submit.disabled = false;
        submit.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
